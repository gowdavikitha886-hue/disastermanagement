<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RakshaNet-X | Multi-Hazard Disaster Management Platform</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <style>
      :root {
        --bg: #f4f6f9;
        --panel: #ffffff;
        --panel-2: #eef1f6;
        --text: #101828;
        --muted: #5b6472;
        --border: #e1e5ec;
        --accent: #1d4ed8;
        --accent-2: #0ea5e9;
        --good: #16a34a;
        --warn: #d97706;
        --bad: #dc2626;
        --crit: #991b1b;
        --shadow:
          0 1px 3px rgba(16, 24, 40, 0.08), 0 1px 2px rgba(16, 24, 40, 0.06);
        --radius: 12px;
        --font:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      }
      :root:not([data-theme="light"]) {
        @media (prefers-color-scheme: dark) {
          --bg: #0b0f17;
          --panel: #121826;
          --panel-2: #1a2233;
          --text: #e7ecf5;
          --muted: #93a0b4;
          --border: #232d40;
          --accent: #3b82f6;
          --accent-2: #22d3ee;
          --good: #22c55e;
          --warn: #f59e0b;
          --bad: #ef4444;
          --crit: #f87171;
          --shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 1px 2px rgba(0, 0, 0, 0.3);
        }
      }
      :root[data-theme="dark"] {
        --bg: #0b0f17;
        --panel: #121826;
        --panel-2: #1a2233;
        --text: #e7ecf5;
        --muted: #93a0b4;
        --border: #232d40;
        --accent: #3b82f6;
        --accent-2: #22d3ee;
        --good: #22c55e;
        --warn: #f59e0b;
        --bad: #ef4444;
        --crit: #f87171;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 1px 2px rgba(0, 0, 0, 0.3);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 8px;
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 20px;
        background: linear-gradient(135deg, #0f2653, #132a63 60%, #0ea5e9);
        color: #fff;
        position: sticky;
        top: 0;
        z-index: 500;
        box-shadow: var(--shadow);
        flex-wrap: wrap;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        font-size: 20px;
      }
      .brand .logo {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 19px;
        border: 1px solid rgba(255, 255, 255, 0.35);
      }
      .brand small {
        display: block;
        font-weight: 500;
        font-size: 11px;
        opacity: 0.85;
      }
      .topbar .spacer {
        flex: 1;
      }
      .clock {
        font-size: 12px;
        opacity: 0.9;
        text-align: right;
        line-height: 1.3;
      }
      .theme-btn,
      .siren-btn,
      .mute-btn,
      .panic-btn-top {
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: #fff;
        border-radius: 8px;
        padding: 7px 10px;
        cursor: pointer;
        font-size: 13px;
      }
      .theme-btn:hover,
      .siren-btn:hover,
      .mute-btn:hover,
      .panic-btn-top:hover {
        background: rgba(255, 255, 255, 0.22);
      }
      .panic-btn-top {
        background: var(--crit);
        border-color: var(--crit);
        font-weight: 800;
      }
      .siren-btn.live {
        background: var(--bad);
        border-color: var(--bad);
        animation: pulseBtn 1s infinite;
      }
      .siren-btn.armed {
        opacity: 0.65;
      }
      @keyframes pulseBtn {
        0%,
        100% {
          filter: brightness(1);
        }
        50% {
          filter: brightness(1.5);
        }
      }

      .tabs {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        padding: 8px 14px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 60px;
        z-index: 400;
      }
      .tabs::-webkit-scrollbar {
        height: 5px;
      }
      .tab-btn {
        flex: 0 0 auto;
        padding: 9px 14px;
        border-radius: 9px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        transition: 0.15s;
      }
      .tab-btn:hover {
        background: var(--panel-2);
        color: var(--text);
      }
      .tab-btn.active {
        background: var(--accent);
        color: #fff;
        box-shadow: var(--shadow);
      }
      .tab-sep {
        width: 1px;
        background: var(--border);
        margin: 4px 4px;
        flex: 0 0 auto;
      }

      .wrap {
        max-width: 1400px;
        margin: 0 auto;
        padding: 18px 16px 60px;
      }
      .view {
        display: none;
        animation: fade 0.25s ease;
      }
      .view.active {
        display: block;
      }
      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      h1.page-title {
        font-size: 21px;
        margin: 2px 0 4px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .page-sub {
        color: var(--muted);
        font-size: 13.5px;
        margin: 0 0 18px;
      }

      .stage-strip {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 16px;
      }
      @media (max-width: 800px) {
        .stage-strip {
          grid-template-columns: 1fr;
        }
      }
      .stage-card {
        border-radius: var(--radius);
        padding: 14px 16px;
        color: #fff;
        cursor: default;
        box-shadow: var(--shadow);
      }
      .stage-card.before {
        background: linear-gradient(135deg, #0f766e, #0ea5e9);
      }
      .stage-card.during {
        background: linear-gradient(135deg, #b91c1c, #ea580c);
      }
      .stage-card.after {
        background: linear-gradient(135deg, #4338ca, #7c3aed);
      }
      .stage-card b {
        display: block;
        font-size: 13px;
        opacity: 0.85;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        margin-bottom: 4px;
      }
      .stage-card .h {
        font-size: 15.5px;
        font-weight: 800;
        margin-bottom: 6px;
      }
      .stage-card .links {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .stage-card .links button {
        background: rgba(255, 255, 255, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.35);
        color: #fff;
        border-radius: 20px;
        padding: 4px 10px;
        font-size: 11.5px;
        cursor: pointer;
        font-weight: 700;
      }
      .stage-card .links button:hover {
        background: rgba(255, 255, 255, 0.32);
      }
      .stage-card p {
        margin: 0;
        font-size: 12.5px;
        opacity: 0.95;
        line-height: 1.4;
      }

      .grid {
        display: grid;
        gap: 14px;
      }
      .g-4 {
        grid-template-columns: repeat(4, 1fr);
      }
      .g-3 {
        grid-template-columns: repeat(3, 1fr);
      }
      .g-2 {
        grid-template-columns: repeat(2, 1fr);
      }
      @media (max-width: 980px) {
        .g-4 {
          grid-template-columns: repeat(2, 1fr);
        }
        .g-3 {
          grid-template-columns: 1fr 1fr;
        }
        .g-2 {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 600px) {
        .g-4 {
          grid-template-columns: 1fr;
        }
        .g-3 {
          grid-template-columns: 1fr;
        }
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        box-shadow: var(--shadow);
        position: relative;
      }
      .card h3 {
        margin: 0 0 12px;
        font-size: 14.5px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .card h3 .tag {
        font-weight: 600;
        font-size: 11px;
        color: var(--muted);
        margin-left: auto;
      }

      .stat-card {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .stat-card .icon {
        font-size: 22px;
      }
      .stat-card .num {
        font-size: 26px;
        font-weight: 800;
      }
      .stat-card .lbl {
        color: var(--muted);
        font-size: 12.5px;
        font-weight: 600;
      }
      .stat-card.b-red {
        border-left: 4px solid var(--bad);
      }
      .stat-card.b-amber {
        border-left: 4px solid var(--warn);
      }
      .stat-card.b-blue {
        border-left: 4px solid var(--accent);
      }
      .stat-card.b-green {
        border-left: 4px solid var(--good);
      }
      .stat-card.b-pink {
        border-left: 4px solid #db2777;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 9px;
        border-radius: 20px;
        font-size: 11.5px;
        font-weight: 700;
      }
      .b-LOW {
        background: rgba(22, 163, 74, 0.15);
        color: var(--good);
      }
      .b-MEDIUM {
        background: rgba(217, 119, 6, 0.15);
        color: var(--warn);
      }
      .b-HIGH {
        background: rgba(220, 38, 38, 0.15);
        color: var(--bad);
      }
      .b-CRITICAL {
        background: rgba(153, 27, 27, 0.2);
        color: var(--crit);
      }
      .b-waiting {
        background: rgba(217, 119, 6, 0.15);
        color: var(--warn);
      }
      .b-assigned {
        background: rgba(14, 165, 233, 0.15);
        color: var(--accent-2);
      }
      .b-rescued {
        background: rgba(22, 163, 74, 0.15);
        color: var(--good);
      }

      .btn {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 9px 14px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: 0.15s;
      }
      .btn:hover {
        filter: brightness(1.08);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .btn.sm {
        padding: 6px 10px;
        font-size: 12px;
        border-radius: 6px;
      }
      .btn.outline {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
      }
      .btn.good {
        background: var(--good);
      }
      .btn.warn {
        background: var(--warn);
      }
      .btn.bad {
        background: var(--bad);
      }
      .btn.pink {
        background: #db2777;
      }
      .btn.block {
        width: 100%;
      }

      label {
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
        display: block;
        margin: 10px 0 4px;
      }
      input[type="text"],
      input[type="number"],
      input[type="tel"],
      select,
      textarea {
        width: 100%;
        padding: 9px 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel-2);
        color: var(--text);
        font-size: 13.5px;
        font-family: var(--font);
      }
      input[type="file"] {
        width: 100%;
        font-size: 12.5px;
        color: var(--muted);
      }
      textarea {
        resize: vertical;
        min-height: 60px;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid var(--accent);
        outline-offset: 0;
      }
      .check-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 4px;
      }
      .check-pill {
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 6px 12px;
        font-size: 12.5px;
        cursor: pointer;
        user-select: none;
        background: var(--panel-2);
      }
      .check-pill.on {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th {
        text-align: left;
        color: var(--muted);
        font-size: 11.5px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        padding: 8px 6px;
        border-bottom: 1px solid var(--border);
      }
      td {
        padding: 9px 6px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }
      tr:last-child td {
        border-bottom: none;
      }
      .table-wrap {
        overflow-x: auto;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .hr {
        height: 1px;
        background: var(--border);
        margin: 14px 0;
      }

      .pill-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .pill {
        border: 1px solid var(--border);
        background: var(--panel-2);
        border-radius: 22px;
        padding: 8px 14px;
        cursor: pointer;
        font-size: 12.5px;
        font-weight: 700;
        color: var(--muted);
      }
      .pill.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      .progress {
        height: 8px;
        border-radius: 6px;
        background: var(--panel-2);
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .progress > div {
        height: 100%;
        background: var(--accent);
      }

      .alert-item {
        border-left: 4px solid var(--bad);
        background: var(--panel-2);
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 8px;
      }
      .alert-item.MEDIUM {
        border-color: var(--warn);
      }
      .alert-item.LOW {
        border-color: var(--good);
      }
      .alert-item.CRITICAL {
        border-color: var(--crit);
      }
      .alert-item .t {
        font-size: 11px;
        color: var(--muted);
      }

      .toast {
        position: fixed;
        bottom: 18px;
        right: 18px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-left: 4px solid var(--good);
        border-radius: 10px;
        padding: 12px 16px;
        box-shadow: var(--shadow);
        max-width: 320px;
        z-index: 900;
        font-size: 13px;
        animation: fade 0.2s ease;
      }
      .toast.CRITICAL {
        border-left-color: var(--crit);
      }

      .leaflet-map {
        width: 100%;
        height: 420px;
        border-radius: 10px;
        border: 1px solid var(--border);
        position: relative;
        z-index: 1;
        isolation: isolate;
      }
      .leaflet-map.small {
        height: 260px;
      }
      /* keep leaflet's own top-left/top-right controls from ever floating above the sticky topbar/tabs */
      .leaflet-top,
      .leaflet-bottom {
        z-index: 350 !important;
      }
      .leaflet-pane {
        z-index: 2 !important;
      }
      .legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 11.5px;
        margin-top: 10px;
        color: var(--muted);
      }
      .legend span.dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        margin-right: 5px;
      }
      .divmarker {
        border-radius: 50%;
        border: 2px solid #fff;
        box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.2);
      }
      .divmarker.pulse {
        animation: markerPulse 1.1s infinite;
      }
      @keyframes markerPulse {
        0% {
          box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.6);
        }
        70% {
          box-shadow: 0 0 0 14px rgba(220, 38, 38, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(220, 38, 38, 0);
        }
      }

      .side-panel {
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        font-size: 13px;
      }
      .photo-preview {
        max-width: 140px;
        border-radius: 8px;
        border: 1px solid var(--border);
        margin-top: 6px;
        display: block;
      }

      .chatlog {
        height: 300px;
        overflow-y: auto;
        background: var(--panel-2);
        border-radius: 10px;
        padding: 12px;
        border: 1px solid var(--border);
        margin-bottom: 10px;
      }
      .msg {
        max-width: 80%;
        padding: 8px 12px;
        border-radius: 12px;
        margin-bottom: 8px;
        font-size: 13.5px;
        line-height: 1.4;
      }
      .msg.bot {
        background: var(--panel);
        border: 1px solid var(--border);
        border-bottom-left-radius: 2px;
      }
      .msg.me {
        background: var(--accent);
        color: #fff;
        margin-left: auto;
        border-bottom-right-radius: 2px;
      }

      .foot {
        text-align: center;
        color: var(--muted);
        font-size: 11.5px;
        margin-top: 30px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
      }
      .risk-gauge {
        text-align: center;
        padding: 10px 0;
      }
      .risk-gauge .score {
        font-size: 44px;
        font-weight: 900;
      }
      .risk-gauge .lvl {
        font-size: 15px;
        font-weight: 800;
        margin-top: 2px;
      }
      .two-col {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 14px;
      }
      @media (max-width: 900px) {
        .two-col {
          grid-template-columns: 1fr;
        }
      }
      .inline-flex {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .chip {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 12px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        font-weight: 700;
        color: var(--muted);
      }
      .critical-banner {
        background: var(--crit);
        color: #fff;
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 12px;
        display: none;
      }
      .critical-banner.show {
        display: block;
      }
      .safe-banner {
        background: rgba(22, 163, 74, 0.12);
        border: 1px solid var(--good);
        color: var(--good);
        padding: 8px 14px;
        border-radius: 10px;
        font-size: 12.5px;
        font-weight: 700;
        margin-bottom: 12px;
      }
      .route-summary {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin: 12px 0;
      }
      @media (max-width: 700px) {
        .route-summary {
          grid-template-columns: 1fr;
        }
      }
      .route-summary .rs {
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .route-summary .rs b {
        display: block;
        font-size: 17px;
      }
      .route-summary .rs span {
        font-size: 11.5px;
        color: var(--muted);
        font-weight: 700;
        text-transform: uppercase;
      }
      .helpline-table td:first-child {
        font-weight: 800;
        white-space: nowrap;
      }
      .helpline-table a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 800;
      }
      .country-flag {
        font-size: 15px;
        margin-right: 4px;
      }
      thumb-img {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="brand">
        <div class="logo">🛡️</div>
        <div>
          RakshaNet-X<small>AI Multi-Hazard Disaster Command Platform</small>
        </div>
      </div>
      <div class="spacer"></div>
      <button class="panic-btn-top" id="panicBtnTop" type="button">
        🆘 PANIC
      </button>
      <button class="siren-btn" id="sirenBtn" type="button">
        🔇 Siren: Standby
      </button>
      <div class="clock" id="clockBox">—</div>
      <button class="theme-btn" id="themeToggle" type="button">🌓 Theme</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="wrap" id="views"></div>
    <div id="toastHost"></div>

    <script>
      /* =====================================================================

      /* ---------------------------- SIREN (Web Audio, no external files) ----------------------------
   IMPORTANT: the siren NEVER plays on load or "just because". It only ever starts when a
   real disaster-severity event fires (a CRITICAL risk assessment, a CRITICAL/HIGH manual
   alert, a CRITICAL SOS, or the panic button), and it auto-silences itself the moment no
   CRITICAL condition remains anywhere in the platform (see checkSirenAutoState()). */
      const Siren = (function () {
        let ctx = null,
          osc = null,
          gain = null,
          lfo = null,
          playing = false;
        function ensureCtx() {
          if (!ctx) {
            ctx = new (window.AudioContext || window.webkitAudioContext)();
          }
          return ctx;
        }
        function start() {
          if (playing) return;
          try {
            ensureCtx();
            if (ctx.state === "suspended") ctx.resume();
            osc = ctx.createOscillator();
            gain = ctx.createGain();
            lfo = ctx.createOscillator();
            const lfoGain = ctx.createGain();
            osc.type = "sawtooth";
            osc.frequency.value = 600;
            lfo.type = "sine";
            lfo.frequency.value = 0.6;
            lfoGain.gain.value = 350;
            lfo.connect(lfoGain);
            lfoGain.connect(osc.frequency);
            gain.gain.value = 0.06;
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            lfo.start();
            playing = true;
            document.getElementById("sirenBtn").classList.add("live");
            document.getElementById("sirenBtn").classList.remove("armed");
            document.getElementById("sirenBtn").innerHTML =
              "🔊 Siren: LIVE — Stop";
          } catch (e) {
            console.warn("Siren unavailable", e);
          }
        }
        function stop() {
          if (!playing) return;
          try {
            osc.stop();
            lfo.stop();
          } catch (e) {}
          playing = false;
          document.getElementById("sirenBtn").classList.remove("live");
          document.getElementById("sirenBtn").classList.add("armed");
          document.getElementById("sirenBtn").innerHTML = "🔇 Siren: Standby";
        }
        function toggle() {
          playing ? stop() : start();
        }
        return { start, stop, toggle, isPlaying: () => playing };
      })();
      document
        .getElementById("sirenBtn")
        .addEventListener("click", Siren.toggle);

      /* Re-evaluates whether ANY real critical condition still exists. If not, silence the
   siren automatically — the platform should be quiet by default and only loud during an
   actual, ongoing emergency. Call this after every state mutation. */
      function checkSirenAutoState() {
        const criticalAlert = STATE.alerts.some((a) => a.level === "CRITICAL");
        const criticalZone = STATE.zones.some(
          (z) => z.riskLevel === "CRITICAL",
        );
        const criticalSos = STATE.sos.some(
          (s) => s.status !== "rescued" && s.priority === "CRITICAL",
        );
        const stillCritical = criticalAlert || criticalZone || criticalSos;
        if (stillCritical) Siren.start();
        else Siren.stop();
      }

      /* ---------------------------- GEO HELPERS ---------------------------- */
      function haversineKm(lat1, lon1, lat2, lon2) {
        const R = 6371,
          dLat = ((lat2 - lat1) * Math.PI) / 180,
          dLon = ((lon2 - lon1) * Math.PI) / 180;
        const a =
          Math.sin(dLat / 2) ** 2 +
          Math.cos((lat1 * Math.PI) / 180) *
            Math.cos((lat2 * Math.PI) / 180) *
            Math.sin(dLon / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }
      function nearestFacility(lat, lng, list) {
        let best = null,
          bestD = Infinity;
        list.forEach((f) => {
          const d = haversineKm(lat, lng, f.lat, f.lng);
          if (d < bestD) {
            bestD = d;
            best = f;
          }
        });
        return best ? { ...best, distanceKm: bestD } : null;
      }

      /* ---------------------------- RISK ENGINE ----------------------------
   Transparent, explainable weighted-scoring model (not a black box).
   This is a rule-based prototype standing in for a trained classifier —
   described honestly as such, not as a live ML model.
------------------------------------------------------------------------ */
      function clampNorm(v, max) {
        v = Number(v) || 0;
        return Math.max(0, Math.min(100, (v / max) * 100));
      }
      function computeRisk(hazardId, inputs) {
        let score = 0;
        switch (hazardId) {
          case "flood":
            score =
              0.4 * clampNorm(inputs.rainfall, 220) +
              0.4 * clampNorm(inputs.waterLevel, 7) +
              0.2 * clampNorm(inputs.soilMoisture, 100);
            break;
          case "flashflood":
            score =
              0.55 * clampNorm(inputs.rainfall, 150) +
              0.3 * clampNorm(inputs.waterLevel, 5) +
              0.15 * clampNorm(inputs.drainage, 100);
            break;
          case "landslide":
            score =
              0.35 * clampNorm(inputs.rainfall, 220) +
              0.35 * clampNorm(inputs.soilMoisture, 100) +
              0.3 * clampNorm(inputs.slope, 60);
            break;
          case "cyclone":
            score =
              0.55 * clampNorm(inputs.windSpeed, 220) +
              0.3 * clampNorm(inputs.rainfall, 220) +
              0.15 * clampNorm(inputs.pressureDrop, 60);
            break;
          case "rainfall":
            score =
              0.6 * clampNorm(inputs.rainfall, 220) +
              0.4 * clampNorm(inputs.duration, 48);
            break;
          case "urbanflood":
            score =
              0.45 * clampNorm(inputs.rainfall, 180) +
              0.3 * clampNorm(inputs.drainage, 100) +
              0.25 * clampNorm(inputs.waterLevel, 4);
            break;
          case "fire":
            score =
              0.35 * clampNorm(Math.max(0, inputs.temperature - 15), 30) +
              0.35 * (100 - clampNorm(inputs.humidity, 100)) +
              0.3 * clampNorm(inputs.windSpeed, 120);
            break;
          case "heatwave":
            score =
              0.6 * clampNorm(Math.max(0, inputs.temperature - 24), 22) +
              0.4 * clampNorm(inputs.humidity, 100);
            break;
          default:
            score = 0;
        }
        score = Math.round(Math.max(0, Math.min(100, score)));
        let level = "LOW";
        if (score >= 80) level = "CRITICAL";
        else if (score >= 55) level = "HIGH";
        else if (score >= 30) level = "MEDIUM";
        return { score, level };
      }

          HIGH: "var(--bad)",
          CRITICAL: "var(--crit)",
        }[level];
      }
      function riskHex(level) {

      /* ========================= LEAFLET MAP ENGINE ========================= */
      const MapRegistry = {}; // containerId -> { map, layer }
      function getOrCreateMap(containerId, center, zoom) {
        if (MapRegistry[containerId] && MapRegistry[containerId].map)
          return MapRegistry[containerId];
        const container = document.getElementById(containerId);
        if (!container) return null;
        const map = L.map(containerId, { scrollWheelZoom: true }).setView(
          center || [13.02, 77.62],
          zoom || 10.4,
        );
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: "&copy; OpenStreetMap contributors",
        }).addTo(map);
        const layer = L.layerGroup().addTo(map);
        MapRegistry[containerId] = { map, layer };
        return MapRegistry[containerId];
      }
      function divIcon(color, symbol, pulse) {
        return L.divIcon({
          className: "",
          html: `<div class="divmarker${pulse ? " pulse" : ""}" style="width:26px;height:26px;background:${color};display:flex;align-items:center;justify-content:center;font-size:14px;">${symbol}</div>`,
          iconSize: [26, 26],
          iconAnchor: [13, 13],
        });
      }
      function renderMap(containerId) {
        const reg = getOrCreateMap(containerId);
        if (!reg) return;
        reg.layer.clearLayers();

        STATE.zones.forEach((z) => {
          const color = riskHex(z.riskLevel);
          L.circle([z.lat, z.lng], {
            radius: 2600,
            color,
            fillColor: color,
            fillOpacity: 0.25,
            weight: 2,
          }).addTo(reg.layer);
          const m = L.marker([z.lat, z.lng], {
            icon: divIcon(color, "⬤", false),
          }).addTo(reg.layer);
          m.bindPopup(
            `<b>${z.name}</b><br>Population: ${z.population.toLocaleString()}<br>Hazard: ${z.hazard}<br>Risk: <b>${z.riskLevel}</b> (${z.riskScore}/100)`,
          );
          m.on("click", () => showZoneDetail(z.id));
        });
        STATE.shelters.forEach((s) => {
          const m = L.marker([s.lat, s.lng], {
            icon: divIcon("#0ea5e9", "🏠", false),
          }).addTo(reg.layer);
          m.bindPopup(
            `<b>🏠 ${s.name}</b><br>${s.occupied}/${s.capacity} occupied${s.medical ? "<br>🏥 Medical support on site" : ""}${s.womenChild ? "<br>👩‍👧 Women & child friendly space" : ""}`,
          );
        });
        STATE.hospitals.forEach((h) => {
          const m = L.marker([h.lat, h.lng], {
            icon: divIcon("#16a34a", "🏥", false),
          }).addTo(reg.layer);
          m.bindPopup(`<b>🏥 ${h.name}</b>`);
        });
        STATE.teams.forEach((t) => {
          const z = zoneById(t.zoneId);
          const sym = t.vehicle.startsWith("Boat")
            ? "🚤"
            : t.vehicle.startsWith("Fire")
              ? "🚒"
              : t.vehicle.startsWith("Amb")
                ? "🚑"
                : "🚓";
          const m = L.marker([z.lat + 0.01, z.lng + 0.01], {
            icon: divIcon(
              t.status === "available" ? "#1d4ed8" : "#94a3b8",
              sym,
              false,
            ),
          }).addTo(reg.layer);
          m.bindPopup(
            `<b>${t.name}</b><br>${t.vehicle}<br>Status: ${t.status}`,
          );
        });
        STATE.sos
          .filter((s) => s.status !== "rescued")
          .forEach((s) => {
            const lat = s.gps ? s.gps.lat : zoneById(s.zoneId).lat;
            const lng = s.gps ? s.gps.lng : zoneById(s.zoneId).lng;
            const critical =
              s.priority === "CRITICAL" ||
              (s.priority === "HIGH" && s.medicalAssist);
            const m = L.marker([lat, lng], {
              icon: divIcon(critical ? "#991b1b" : "#d97706", "🆘", critical),
            }).addTo(reg.layer);
            m.bindPopup(
              `<b>🆘 ${s.id}</b>${s.name ? " — " + s.name : ""}${s.age ? " (" + s.age + " yrs)" : ""}<br>${s.people} people · ${s.types.join(", ")}<br>Priority: <b>${s.priority}</b><br>${s.photo ? `<img src="${s.photo}" style="width:100px;border-radius:6px;margin-top:6px">` : ""}`,
            );
            if (critical && s.route) {
              const line = L.polyline(s.route.coords, {
                color: "#dc2626",
                weight: 4,
                dashArray: s.route.real ? null : "8 6",
              }).addTo(reg.layer);
              L.marker([s.route.destLat, s.route.destLng], {
                icon: divIcon("#16a34a", "🏥", false),
              })
                .addTo(reg.layer)
                .bindPopup(
                  `<b>Route target:</b> ${s.route.destName}<br>${s.route.distanceKm.toFixed(1)} km`,
                );
            }
          });
      }
      function fitMapToAll(containerId) {
        const reg = MapRegistry[containerId];

  `;

      let routeGpsOverride = null;
      function renderRouter() {
        // ensure a fresh, correctly-sized map exists for this tab specifically
        getOrCreateMap("map-router", [24, 78], 4.2);
      }
      function bindRouter() {
        document.getElementById("routeUseGps").addEventListener("click", () => {
          const statusEl = document.getElementById("routeGpsStatus");
          if (!navigator.geolocation) {
            statusEl.textContent = "Geolocation not supported by this browser.";
            return;
          }
          statusEl.textContent = "Requesting live location permission…";
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              routeGpsOverride = {
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
              };
              statusEl.innerHTML = `✅ Using live GPS as "From": ${routeGpsOverride.lat.toFixed(5)}, ${routeGpsOverride.lng.toFixed(5)}`;
            },
            (err) => {
              statusEl.textContent = "Could not get location: " + err.message;
            },
            { enableHighAccuracy: true, timeout: 10000 },
          );
        });
        document
          .getElementById("routeGoBtn")
          .addEventListener("click", async () => {
            const fromId = document.getElementById("routeFrom").value;
            const toId = document.getElementById("routeTo").value;
            const to = locById(toId);
            const from = routeGpsOverride
              ? {
                  name: "Your live GPS location",
                  lat: routeGpsOverride.lat,
                  lng: routeGpsOverride.lng,
                  flag: "📍",
                }
              : locById(fromId);
            if (!from || !to) return;
            const straight = haversineKm(from.lat, from.lng, to.lat, to.lng);
            const host = document.getElementById("routeResult");
            host.innerHTML = `
      <div class="route-summary">
        <div class="rs"><span>From</span><b>${from.flag || ""} ${from.name}</b></div>
        <div class="rs"><span>To</span><b>${to.flag || ""} ${to.name}</b></div>
        <div class="rs"><span>Straight-line distance</span><b>${straight.toFixed(1)} km</b></div>
      </div>
      <p class="small muted" id="routeRoadNote">Fetching real road route and driving distance/time…</p>
    `;
            const reg = getOrCreateMap("map-router", [24, 78], 4.2);
            reg.layer.clearLayers();
            L.marker([from.lat, from.lng], {
              icon: divIcon("#16a34a", "🟢", false),
            })
              .addTo(reg.layer)
              .bindPopup(`<b>From:</b> ${from.name}`);
            L.marker([to.lat, to.lng], {
              icon: divIcon("#dc2626", "🔴", false),
            })
              .addTo(reg.layer)
              .bindPopup(`<b>To:</b> ${to.name}`);
            const straightLine = L.polyline(
              [
                [from.lat, from.lng],
                [to.lat, to.lng],
              ],
              { color: "#94a3b8", weight: 3, dashArray: "6 8" },
            ).addTo(reg.layer);
            reg.map.fitBounds(straightLine.getBounds(), { padding: [40, 40] });
            setTimeout(() => reg.map.invalidateSize(), 50);

            pushLog(
              `📍 Route calculated: <b>${from.name}</b> → <b>${to.name}</b> (${straight.toFixed(1)} km straight-line)`,
            );
            saveState();

            const roadData = await tryRealRouteFull(
              from.lat,
              from.lng,
              to.lat,
              to.lng,
            );
            const note = document.getElementById("routeRoadNote");
            if (roadData && roadData.coords && roadData.coords.length) {
              L.polyline(roadData.coords, {
                color: "#1d4ed8",
                weight: 4,
              }).addTo(reg.layer);
              reg.map.fitBounds(L.polyline(roadData.coords).getBounds(), {
                padding: [40, 40],
              });
              const hrs = Math.floor(roadData.durationSec / 3600);
              const mins = Math.round((roadData.durationSec % 3600) / 60);
              document.querySelector(".route-summary").insertAdjacentHTML(
                "beforeend",
                `<div class="rs"><span>Real road distance</span><b>${(roadData.distanceMeters / 1000).toFixed(1)} km</b></div>
               <div class="rs"><span>Estimated drive time</span><b>${hrs > 0 ? hrs + "h " : ""}${mins}m</b></div>`,
              );
              if (note)
                note.textContent =
                  "Real road route drawn on the map (solid blue line) alongside the straight-line distance (dashed grey).";
            } else {
              if (note)
                note.textContent =
                  "Live road-routing service unreachable from this browser right now — showing the straight-line (great-circle) distance only, which is still the exact geographic distance between the two points.";
            }
          });
      }
      // Fetches a real road route + duration from the public OSRM demo API (runs in the visitor's
      // own browser, not this sandbox — works wherever the person opens the published page).
      async function tryRealRouteFull(lat1, lng1, lat2, lng2) {
        try {
          const url = `https://router.project-osrm.org/route/v1/driving/${lng1},${lat1};${lng2},${lat2}?overview=full&geometries=geojson`;
          const res = await fetch(url);
          if (!res.ok) return null;
          const data = await res.json();
          const route = data && data.routes && data.routes[0];
          if (!route || !route.geometry) return null;
          return {
            coords: route.geometry.coordinates.map((c) => [c[1], c[0]]),
            distanceMeters: route.distance,
            durationSec: route.duration,
          };
        } catch (e) {
          return null;
        }
      }

      let selectedSosTypes = new Set();

      function bindSos() {

        zoneSel.innerHTML = STATE.zones
          .map((z) => `<option value="${z.id}">${z.name}</option>`)

          if (types.length === 0) {

          let priority = "MEDIUM";
          if (
            types.includes("Trapped") ||
            types.includes("Medical") ||
            types.includes("Missing Person") ||
            types.includes("Woman/Child at risk") ||
            medicalAssist
          )
            priority = "HIGH";
          const zone = zoneById(zoneId);
          if (

          const id = "SOS-" + STATE.sosCounter;
          const nearestTeam =
            STATE.teams.find(
              (t) => t.zoneId === zoneId && t.status === "available",
            ) || STATE.teams.find((t) => t.status === "available");

          const record = {
            id,

            age: age || null,

            message: msg,
            priority,

            gps: capturedGps,
            photo: capturedPhoto,
            route: null,

            capturedGps
          ) {
            const dest = nearestFacility(

                coords: [

                ],

      // Attempts a real road route via the public OSRM demo API; falls back to the straight line already set.
      async function tryRealRoute(lat1, lng1, lat2, lng2) {
        try {
          const url = `https://router.project-osrm.org/route/v1/driving/${lng1},${lat1};${lng2},${lat2}?overview=full&geometries=geojson`;
          const res = await fetch(url);
          if (!res.ok) return null;
          const data = await res.json();
          const geom =
            data &&
            data.routes &&
            data.routes[0] &&
            data.routes[0].geometry &&
            data.routes[0].geometry.coordinates;
          if (!geom) return null;
          return geom.map((c) => [c[1], c[0]]);
        } catch (e) {
          return null;
        } // offline / blocked — the straight-line fallback already drawn stays in place
      }

        const v = el(`<div class="view" id="view-evac"></div>`);
        v.innerHTML = `
    <h1 class="page-title">🧭 Evacuation Planner</h1>
    <p class="page-sub">Pick an affected zone — the planner finds the nearest shelter with free capacity, computes real distance, and generates a plan.</p>
    <div class="card">
      <label>Affected Zone</label><select id="evacZone"></select>
      <label class="inline-flex" style="cursor:pointer"><input type="checkbox" id="evacPrioritizeWC" style="width:auto"> &nbsp;Prioritise a women & child-friendly shelter</label>
      <button class="btn" style="margin-top:10px" id="evacBtn" type="button">🧭 Generate Evacuation Plan</button>
      <div id="evacResult" style="margin-top:16px"></div>
    </div>
  `;
        return v;
      }
      function renderEvac() {
        const sel = document.getElementById("evacZone");
        if (sel && !sel.options.length)
          sel.innerHTML = STATE.zones
            .map((z) => `<option value="${z.id}">${z.name}</option>`)
            .join("");
      }
      function bindEvac() {
        document.getElementById("evacBtn").addEventListener("click", () => {
          const zoneId = document.getElementById("evacZone").value;
          const wcOnly = document.getElementById("evacPrioritizeWC").checked;
          const zone = zoneById(zoneId);
          let candidates = STATE.shelters
            .filter((s) => s.capacity - s.occupied > 0)
            .map((s) => ({
              ...s,
              dist: haversineKm(zone.lat, zone.lng, s.lat, s.lng),
            }))
            .sort((a, b) => a.dist - b.dist);
          if (wcOnly && candidates.some((c) => c.womenChild))
            candidates = candidates.filter((c) => c.womenChild);
          const best = candidates[0];
          const host = document.getElementById("evacResult");
          if (!best) {
            host.innerHTML = `<p class="small" style="color:var(--bad)">⚠️ No shelters currently have free capacity. Recommend opening an emergency overflow shelter.</p>`;
            return;
          }
          host.innerHTML = `
      <div class="side-panel">
        <b>EVACUATION PLAN — ${zone.name} → ${best.name}</b>
        <div class="hr"></div>
        <div class="small">Population to move: <b>${zone.population.toLocaleString()}</b></div>
        <div class="small">Distance: <b>${best.dist.toFixed(1)} km</b> (straight-line)</div>
        <div class="small">Shelter capacity available: <b>${best.capacity - best.occupied}</b> / ${best.capacity}</div>
        <div class="small">Medical support at shelter: <b>${best.medical ? "Yes" : "No"}</b></div>
        <div class="small">Women & child-friendly space: <b>${best.womenChild ? "Yes" : "No"}</b></div>
        <div class="hr"></div>
        <b class="small">Route Instructions</b>
        <ol class="small">
          <li>Assemble at ${zone.name} designated pickup point.</li>
          <li>Move via main arterial road toward ${zoneById(best.zoneId).name}.</li>
          <li>Report to shelter registration desk at ${best.name}.</li>
          <li>Priority boarding for elderly, children, pregnant women, and medical cases.</li>
        </ol>
      </div>`;
          pushLog(
            `🧭 Evacuation plan generated: <b>${zone.name}</b> → <b>${best.name}</b>`,
          );
          saveState();
        });
      }

      /* ========================= RECOVERY / ANALYTICS (AFTER) ========================= */
      function buildRecoveryView() {
        const v = el(`<div class="view" id="view-recovery"></div>`);
        v.innerHTML = `
    <h1 class="page-title">📊 Recovery & Post-Disaster Analytics <span class="chip">AFTER</span></h1>
    <p class="page-sub">All numbers below are computed live from actual rescue and relief actions taken in this session.</p>
    <div class="grid g-4" id="recoveryStats"></div>
    <div class="hr"></div>
    <div class="grid g-2">
      <div class="card"><h3>📦 Resources Dispatched by Type</h3><canvas id="chartRelief" height="180"></canvas></div>
      <div class="card"><h3>🧮 SOS Status Breakdown</h3><canvas id="chartSosStatus" height="180"></canvas></div>
    </div>
  `;
        return v;
      }
      let chartRelief = null,
        chartSosStatus = null;
      function renderRecovery() {
        const host = document.getElementById("recoveryStats");
        if (!host) return;
        const r = STATE.recovery;
        const totalRelief = STATE.reliefLog.reduce(
          (s, l) => s + l.food + l.water + l.medicine + l.blankets,
          0,
        );
        host.innerHTML = `
    <div class="card stat-card b-green"><div class="icon">🟢</div><div class="num">${r.rescued}</div><div class="lbl">People Rescued</div></div>
    <div class="card stat-card b-blue"><div class="icon">🏠</div><div class="num">${r.relocated}</div><div class="lbl">People Relocated</div></div>
    <div class="card stat-card b-amber"><div class="icon">📦</div><div class="num">${totalRelief.toLocaleString()}</div><div class="lbl">Relief Units Dispatched</div></div>
    <div class="card stat-card b-red"><div class="icon">🏚️</div><div class="num">${r.buildingsDamaged}</div><div class="lbl">Buildings Reported Damaged</div></div>
  `;
        const sums = { food: 0, water: 0, medicine: 0, blankets: 0 };
        STATE.reliefLog.forEach((l) => {
          sums.food += l.food;
          sums.water += l.water;
          sums.medicine += l.medicine;
          sums.blankets += l.blankets;
        });
        const ctx1 = document.getElementById("chartRelief");
        if (chartRelief) chartRelief.destroy();
        chartRelief = new Chart(ctx1, {
          type: "bar",
          data: {
            labels: ["Food", "Water", "Medicine", "Blankets"],
            datasets: [
              {
                data: [sums.food, sums.water, sums.medicine, sums.blankets],
                backgroundColor: ["#1d4ed8", "#0ea5e9", "#d97706", "#16a34a"],
              },
            ],
          },
          options: { plugins: { legend: { display: false } } },
        });

        const statusCount = { waiting: 0, assigned: 0, rescued: 0 };
        STATE.sos.forEach((s) => statusCount[s.status]++);
        const ctx2 = document.getElementById("chartSosStatus");
        if (chartSosStatus) chartSosStatus.destroy();
        chartSosStatus = new Chart(ctx2, {
          type: "doughnut",
          data: {
            labels: ["Waiting", "Assigned", "Rescued"],
            datasets: [
              {
                data: [
                  statusCount.waiting,
                  statusCount.assigned,
                  statusCount.rescued,
                ],
                backgroundColor: ["#d97706", "#0ea5e9", "#16a34a"],
              },
            ],
          },
          options: { plugins: { legend: { position: "bottom" } } },
        });
      }

      /* ========================= ASSISTANT ========================= */
      function buildAssistantView() {
        const v = el(`<div class="view" id="view-assistant"></div>`);
        v.innerHTML = `
    <h1 class="page-title">💬 Disaster Assistant</h1>
    <p class="page-sub">A controlled knowledge-base assistant (not an open LLM) that answers from the platform's live data — try "nearest shelter", "active alerts", "flood safety tips", "women helpline", "distance Karachi to Lahore".</p>
    <div class="card">
      <div class="chatlog" id="chatLog"></div>
      <div class="inline-flex">
        <input type="text" id="chatInput" placeholder="Ask e.g. 'which shelter has space' or 'flood safety tips'">
        <button class="btn" id="chatSendBtn" type="button">Send</button>
      </div>
      <div class="pill-row" style="margin-top:10px">
        <button class="pill" data-q="active alerts" type="button">Active alerts</button>
        <button class="pill" data-q="nearest shelter" type="button">Nearest shelter</button>
        <button class="pill" data-q="flood safety tips" type="button">Flood safety tips</button>
        <button class="pill" data-q="women helpline" type="button">Women helpline</button>
        <button class="pill" data-q="child helpline" type="button">Child helpline</button>
      </div>
    </div>
  `;
        return v;
      }
      function botReply(q) {
        const s = q.toLowerCase();
        if (s.includes("women") && s.includes("helpline"))
          return `Women's helplines: 🇮🇳 India 1091 / 181 · 🇵🇰 Pakistan Madadgaar 1043 · 🇯🇵 Japan Domestic Violence Hotline 0570-0-55210. Full list is in the Women & Child Safety tab.`;
        if (s.includes("child") && s.includes("helpline"))
          return `Child helplines: 🇮🇳 India 1098 · 🇵🇰 Pakistan Child Protection 1121 · 🇯🇵 Japan Child Consultation Centre 189. Full list is in the Women & Child Safety tab.`;
        if (s.includes("panic"))
          return 'Use the red "🆘 PANIC" button in the top bar, or open the "Women & Child Safety" tab, to send an instant CRITICAL SOS with your live GPS.';
        if (
          s.includes("distance") ||
          s.includes("router") ||
          s.includes("route")
        )
          return 'Open the "Location Router" tab, pick a From and To location anywhere in India, Pakistan or Japan (or use your live GPS), and it will show the exact straight-line distance plus a real road route and drive time.';
        if (s.includes("shelter")) {
          const best = [...STATE.shelters].sort(
            (a, b) => b.capacity - b.occupied - (a.capacity - a.occupied),
          )[0];
          return `The shelter with the most free capacity right now is <b>${best.name}</b> in ${zoneById(best.zoneId).name}, with ${best.capacity - best.occupied} of ${best.capacity} spaces available${best.medical ? " and on-site medical support" : ""}${best.womenChild ? ", including a women & child-friendly space" : ""}.`;
        }
        if (s.includes("alert")) {
          const active = STATE.alerts.filter(
            (a) => a.level === "HIGH" || a.level === "CRITICAL",
          );
          if (!active.length)
            return "There are currently no active High or Critical alerts on the platform.";
          return (
            `There ${active.length === 1 ? "is" : "are"} ${active.length} active high-severity alert${active.length === 1 ? "" : "s"}: ` +
            active.map((a) => a.title).join("; ") +
            "."
          );
        }
        if (s.includes("sos") || s.includes("emergency"))
          return 'To send an emergency SOS, go to the "Citizen SOS" tab, tap "Get My Live GPS Location", select the emergency type, and tap Send SOS. Your request appears immediately in Rescue Coordination.';
        if (s.includes("flood"))
          return "Flood safety: move to higher ground immediately, avoid walking or driving through moving water, stay off flooded roads, keep away from downed power lines, and follow official evacuation routes to your nearest shelter.";
        if (s.includes("earthquake"))
          return "Earthquake safety: Drop, Cover, and Hold On. Stay away from windows and heavy furniture, and if outdoors move to open ground away from buildings and power lines.";
        if (s.includes("landslide"))
          return "Landslide safety: watch for cracks in the ground, tilting trees or poles, and unusual sounds. Move away from steep slopes and drainage channels during heavy rain.";
        if (s.includes("cyclone"))
          return "Cyclone safety: secure loose objects outdoors, stock food/water/torches, stay indoors away from windows, and follow the coastal evacuation plan if advised.";
        if (s.includes("heatwave") || s.includes("heat"))
          return "Heatwave safety: stay hydrated, avoid outdoor activity during peak afternoon heat, wear light clothing, and check on elderly neighbours.";
        if (s.includes("fire"))
          return "Forest fire safety: keep a cleared perimeter around structures, evacuate early when advised, and avoid dry vegetation zones during high wind-fire risk periods.";
        if (s.includes("rescue") || s.includes("team")) {
          const avail = STATE.teams.filter(
            (t) => t.status === "available",
          ).length;
          return `Currently ${avail} of ${STATE.teams.length} rescue units are available for dispatch.`;
        }
        if (s.includes("siren"))
          return "The siren is silent by default. It only activates automatically for a CRITICAL risk zone, a CRITICAL alert, a CRITICAL SOS case, or the panic button — and switches itself off the moment none of those remain.";
        return "I can help with: active alerts, nearest shelter with space, sending an SOS, the panic button, distance between two cities (Location Router), or safety tips for flood, landslide, cyclone, heatwave, forest fire and earthquake. Try asking one of those.";
      }
      function bindAssistant() {
        const log = document.getElementById("chatLog");
        function addMsg(text, who) {
          const d = document.createElement("div");
          d.className = "msg " + (who === "me" ? "me" : "bot");
          d.innerHTML = text;
          log.appendChild(d);
          log.scrollTop = log.scrollHeight;
        }
        addMsg(
          "Hi, I'm the RakshaNet-X Disaster Assistant. Ask me about shelters, alerts, the panic button, city-to-city distances, or safety tips.",
          "bot",
        );
        function send(q) {
          if (!q.trim()) return;
          addMsg(q, "me");
          setTimeout(() => addMsg(botReply(q), "bot"), 250);
          document.getElementById("chatInput").value = "";
        }
        document
          .getElementById("chatSendBtn")
          .addEventListener("click", () =>
            send(document.getElementById("chatInput").value),
          );
        document
          .getElementById("chatInput")
          .addEventListener("keydown", (e) => {
            if (e.key === "Enter") send(e.target.value);
          });
        document
          .querySelector("#view-assistant .pill-row")
          .addEventListener("click", (e) => {
            const p = e.target.closest(".pill[data-q]");
            if (!p) return;
            send(p.dataset.q);
          });
      }

      /* ---------------------------- GLOBAL DELEGATED CLICK HANDLER ----------------------------
   Handles all dynamically-rendered table/card action buttons in one place so nothing
   ever goes "stuck" after a re-render replaces innerHTML. */
      document.addEventListener("click", function (e) {
        const t = e.target;
        const assignBtn = t.closest('[data-act="assign"]');
        if (assignBtn) {
          assignTeam(assignBtn.dataset.id);
          return;
        }
        const rescueBtn = t.closest('[data-act="rescue"]');
        if (rescueBtn) {
          markRescued(rescueBtn.dataset.id);
          return;
        }
        const shelterBtn = t.closest("button[data-a]");
        if (shelterBtn) {
          const s = shelterById(shelterBtn.dataset.id);
          s.occupied = Math.max(
            0,
            Math.min(s.capacity, s.occupied + parseInt(shelterBtn.dataset.a)),
          );
          saveState();
          renderShelters();
          renderDashboard();
          renderSafety();
          return;
        }
      });

      /* ---------------------------- INIT ---------------------------- */
      function renderAll() {
        try {
          renderDashboard();
        } catch (e) {
          console.error("dashboard", e);
        }
        try {
          renderHazardPills();
          renderRiskInputs();
        } catch (e) {
          console.error("risk", e);
        }
        try {
          renderMap("map-main");
        } catch (e) {
          console.error("map", e);
        }
        try {
          renderAlerts();
        } catch (e) {
          console.error("alerts", e);
        }
        try {
          renderSosHistory();
        } catch (e) {
          console.error("sos", e);
        }
        try {
          renderRescue();
        } catch (e) {
          console.error("rescue", e);
        }
        try {
          renderShelters();
        } catch (e) {
          console.error("shelters", e);
        }
        try {
          renderSafety();
        } catch (e) {
          console.error("safety", e);
        }
        try {
          renderRelief();
        } catch (e) {
          console.error("relief", e);
        }
        try {
          renderEvac();
        } catch (e) {
          console.error("evac", e);
        }
        try {
          renderRecovery();
        } catch (e) {
          console.error("recovery", e);
        }
      }

      loadState();
      buildTabs();
      buildViews();
      bindRiskEngine();
      bindAlerts();
      bindSos();
      bindRelief();
      bindEvac();
      bindSafety();
      bindRouter();
      bindAssistant();
      renderAll();
      showView("dashboard");
      // Siren must reflect real state on load, not just be silent by default —
      // if a previous session was saved mid-disaster, restore the alarm; otherwise stay quiet.
      checkSirenAutoState();
    </script>
  </body>
</html>
